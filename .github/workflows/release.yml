name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/tickmark-${{ steps.ver.outputs.version }}.tar.gz \
            bin media out package.json README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tickmark-${{ steps.ver.outputs.version }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
